name: Sync public analyzer

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-public-analyzer
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch server-rendered report and data
        shell: bash
        run: |
          set -euo pipefail
          base="https://futureofinquiry.org/field-meter/maglab-session-console/public"
          reader="https://r.jina.ai/$base"
          curl --fail --silent --show-error --max-time 60 --retry 3 "$reader/" -o report.reader
          curl --fail --silent --show-error --max-time 60 --retry 3 "$reader/data.json" -o data.reader
          awk 'body { print } /^Markdown Content:$/ { body=1; next }' report.reader > README.md
          awk 'body { print } /^Markdown Content:$/ { body=1; next }' data.reader > data.json
          rm report.reader data.reader
          jq empty data.json
          sed -i '1a\\\n\\\n> Public read-only analyzer mirror. [Machine-readable data](data.json). Updated automatically from the live analyzer; no login or JavaScript required.\\\n' README.md
      - name: Publish changes
        shell: bash
        run: |
          if git diff --quiet -- README.md data.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data.json
          git commit -m "Sync public analyzer"
          git push
